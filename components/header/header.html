<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACB Header</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">

            <!-- Logo da ACB -->
            <a href="#" class="header-logo">
                <img class="logo-icon" src="/images/logo.png" alt="ACB Logo">
            </a>

            <!-- Nav desktop -->
            <nav class="header-nav" id="headerNav" aria-label="Navegação principal">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Artigos</a>
                <a href="#" class="nav-link">Quem somos</a>
                <a href="#" class="nav-link">Contato</a>
            </nav>

            <!-- Botão de Associe-se -->
            <a href="#" class="header-cta">Associe-se</a>

            <!-- Menu hamburguer -->
            <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="headerNav">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
            <nav class="mobile-nav" aria-label="Menu mobile">
                <a href="#" class="mobile-nav-link">Home</a>
                <a href="#" class="mobile-nav-link">Artigos</a>
                <a href="#" class="mobile-nav-link">Quem somos</a>
                <a href="#" class="mobile-nav-link active">Contato</a>
                <a href="#" class="header-cta mobile-cta">Associe-se</a>
            </nav>
        </div>

    </header>

    <!-- Exemplo contato -->
    <section class="hero-demo">
        <p class="hero-label">FALE CONOSCO</p>
        <h1>Contato</h1>
        <p class="hero-sub">Tem alguma dúvida ou quer saber mais sobre a ACBrasil? Estamos aqui para ajudar.</p>
    </section>

    <script src="header.js"></script>
    
</body>
</html>
